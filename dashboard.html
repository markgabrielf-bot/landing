<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — The Edit Bay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14151A; --panel: #1E2027; --panel-line: #2B2E38;
    --text: #F2F0EA; --text-dim: #9AA0AC;
    --signal-red: #FF4D5E; --scope-cyan: #37D6C4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Poppins', sans-serif;}

  header{
    display:flex; justify-content:space-between; align-items:center;
    padding:20px 5vw; border-bottom:1px solid var(--panel-line);
  }
  .brand{font-weight:800; font-size:1.1rem;}
  .brand .accent{color:var(--signal-red);}
  .who{font-size:13px; color:var(--text-dim); text-align:right; font-weight:500;}
  .who strong{color:var(--text);}
  .header-right{display:flex; align-items:center; gap:10px;}
  .icon-btn{
    background:none; border:1px solid var(--panel-line); color:var(--text-dim);
    font-family:'Poppins', sans-serif; font-weight:600; font-size:12px; padding:8px 14px;
    border-radius:8px; cursor:pointer;
  }
  .icon-btn:hover{border-color:var(--scope-cyan); color:var(--text);}
  .icon-btn.danger:hover{border-color:var(--signal-red);}

  main{padding:6vh 5vw; max-width:900px; margin:0 auto;}
  h1{font-size:2rem; font-weight:800; margin-bottom:10px;}
  .sub{color:var(--text-dim); margin-bottom:30px;}
  .loading{color:var(--text-dim); padding:40px 0;}
  .empty-state{color:var(--text-dim); padding:40px 0; text-align:center;}
  .back-link{color:var(--text-dim); text-decoration:none; font-size:13px; font-weight:600; background:none; border:none; cursor:pointer; font-family:'Poppins', sans-serif; margin-bottom:22px; display:inline-block;}
  .back-link:hover{color:var(--text);}

  /* ---- Course catalog ---- */
  .course-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:18px;}
  .course-card{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:10px;
    overflow:hidden; cursor:pointer; display:flex; flex-direction:column; transition:border-color 0.15s ease;
  }
  .course-card:hover{border-color:var(--scope-cyan);}
  .course-thumb{width:100%; height:140px; background:var(--bg); object-fit:cover; display:block;}
  .course-thumb-placeholder{
    width:100%; height:140px; background:var(--bg); display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:12px;
  }
  .course-card-body{padding:18px 20px; display:flex; flex-direction:column; gap:10px; flex:1;}
  .course-card-body h3{font-size:1.05rem; font-weight:700;}
  .course-card-body p{font-size:13px; color:var(--text-dim); line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .course-progress-shell{background:var(--bg); border-radius:6px; padding:3px; margin-top:auto;}
  .course-progress-bar{height:6px; background:var(--scope-cyan); border-radius:5px; width:0%;}
  .course-progress-label{font-size:11.5px; color:var(--text-dim); font-weight:600; margin-top:6px;}

  /* ---- Course detail (modules) ---- */
  .course-detail-head{margin-bottom:26px;}
  .course-detail-head h1{margin-bottom:6px;}
  .progress-shell{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:8px;
    padding:4px; margin-bottom:36px;
  }
  .progress-bar{height:8px; background:var(--scope-cyan); border-radius:6px; width:0%; transition:width 0.3s ease;}
  .progress-label{font-size:12px; color:var(--text-dim); margin-bottom:10px; text-align:right; font-weight:600;}

  .module{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:10px;
    margin-bottom:10px; overflow:hidden;
  }
  .module.done{border-color:var(--scope-cyan);}
  .module-head{
    display:flex; align-items:center; gap:18px; padding:18px 20px; cursor:pointer;
  }
  .module-head .num{font-weight:700; font-size:13px; color:var(--scope-cyan); width:52px; flex-shrink:0;}
  .module-info{flex:1;}
  .module-info h3{font-size:1rem; font-weight:700;}
  .module-body{display:none; padding:0 20px 22px; border-top:1px solid var(--panel-line);}
  .module-body.open{display:block; padding-top:18px;}
  .video-wrap{position:relative; padding-bottom:56.25%; height:0; margin-bottom:16px; background:var(--bg); border-radius:8px; overflow:hidden;}
  .video-wrap iframe{position:absolute; top:0; left:0; width:100%; height:100%; border:0;}
  .no-video{color:var(--text-dim); font-size:13px; padding:20px; text-align:center; background:var(--bg); border-radius:8px; margin-bottom:16px;}
  .module-desc{font-size:14px; color:var(--text-dim); line-height:1.6; margin-bottom:16px;}
  .file-links{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
  .file-link{
    display:flex; align-items:center; gap:8px; font-size:13px; color:var(--scope-cyan);
    text-decoration:none; background:var(--bg); border:1px solid var(--panel-line);
    border-radius:6px; padding:9px 12px;
  }
  .file-link:hover{border-color:var(--scope-cyan);}
  .check-btn{
    background:var(--bg); border:1px solid var(--panel-line); color:var(--text-dim);
    font-family:'Poppins', sans-serif; font-weight:600; font-size:12px;
    padding:9px 16px; border-radius:8px; cursor:pointer;
  }
  .check-btn.done{background:var(--scope-cyan); color:#14151A; border-color:var(--scope-cyan);}
  .check-btn:hover{border-color:var(--scope-cyan);}

  /* Settings modal */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6);
    align-items:center; justify-content:center; padding:24px; z-index:10;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:10px;
    padding:32px; max-width:420px; width:100%;
  }
  .modal h2{font-size:1.3rem; font-weight:700; margin-bottom:14px;}
  .modal p{color:var(--text-dim); font-size:14px; line-height:1.6; margin-bottom:20px;}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end;}
  .btn-cancel{
    background:none; border:1px solid var(--panel-line); color:var(--text-dim);
    font-family:'Poppins', sans-serif; font-weight:600; font-size:13px;
    padding:10px 18px; border-radius:8px; cursor:pointer;
  }
  .btn-delete{
    background:var(--signal-red); color:#14151A; border:none;
    font-family:'Poppins', sans-serif; font-weight:700; font-size:13px;
    padding:10px 18px; border-radius:8px; cursor:pointer;
  }
  .btn-delete:disabled{opacity:0.5; cursor:not-allowed;}
  .modal-status{font-size:12px; color:var(--signal-red); margin-top:10px; min-height:16px;}
</style>
</head>
<body>

  <header>
    <span class="brand">THE EDIT <span class="accent">BAY</span></span>
    <div class="header-right">
      <span class="who" id="who-info">Loading...</span>
      <a class="icon-btn" href="admin.html" id="admin-link" style="display:none; text-decoration:none;">Admin Panel</a>
      <button class="icon-btn" id="settings-btn">Settings</button>
      <button class="icon-btn" id="logout-btn">Log Out</button>
    </div>
  </header>

  <main>
    <div id="loading" class="loading">Loading your courses...</div>
    <div id="content" style="display:none;"></div>
  </main>

  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <h2>Account settings</h2>
      <p>Deleting your account permanently removes your profile and progress from the database. This can't be undone.</p>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancel-settings">Cancel</button>
        <button class="btn-delete" id="confirm-delete">Delete My Account</button>
      </div>
      <div class="modal-status" id="delete-status"></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://jayrwrnlndlavmxywazz.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpheXJ3cm5sbmRsYXZteHl3YXp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNDIwODgsImV4cCI6MjEwMDcxODA4OH0.lRSNGUf_sKE2vzy39zT1BYGUnHH-bXWiR1GnxOCgJpQ';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const content = document.getElementById('content');

  let currentUser = null;
  let currentSession = null;
  let completedSet = new Set(); // module ids
  let courses = [];
  let allModules = []; // all modules across all courses: {id, course_id, position, title, ...}
  let courseThumbUrls = {};
  let currentCourseId = null;
  let openModuleId = null;

  function getYouTubeId(url) {
    if (!url) return null;
    const patterns = [
      /(?:youtu\.be\/)([\w-]+)/,
      /(?:youtube\.com\/watch\?v=)([\w-]+)/,
      /(?:youtube\.com\/embed\/)([\w-]+)/
    ];
    for (const p of patterns) {
      const m = url.match(p);
      if (m) return m[1];
    }
    return null;
  }

  function escapeHtml(str) {
    return String(str==null?'':str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    currentUser = session.user;
    currentSession = session;

    const { data: profile } = await sb.from('profiles')
      .select('full_name, fire_station, is_admin')
      .eq('id', currentUser.id).single();

    document.getElementById('who-info').innerHTML =
      (profile ? '<strong>' + escapeHtml(profile.full_name) + '</strong><br>' + escapeHtml(profile.fire_station) : currentUser.email);

    if (profile && profile.is_admin) {
      document.getElementById('admin-link').style.display = 'inline-block';
    }

    const { data: progressRows } = await sb.from('progress').select('module_id').eq('user_id', currentUser.id);
    completedSet = new Set((progressRows || []).map(r => r.module_id));

    const { data: courseRows } = await sb.from('courses').select('*').order('created_at');
    const { data: contentRows } = await sb.from('course_content').select('*').order('position');
    courses = courseRows || [];
    allModules = contentRows || [];

    document.getElementById('loading').style.display = 'none';
    content.style.display = 'block';
    await renderCatalog();
  }

  // ============================================================
  // CATALOG VIEW
  // ============================================================
  async function renderCatalog() {
    currentCourseId = null;

    courseThumbUrls = {};
    await Promise.all(courses.map(async c => {
      if (c.thumbnail_path) {
        const { data } = await sb.storage.from('course-files').createSignedUrl(c.thumbnail_path, 3600);
        if (data) courseThumbUrls[c.id] = data.signedUrl;
      }
    }));

    content.innerHTML =
      '<h1>Your courses</h1>' +
      '<p class="sub">Pick a course to continue where you left off.</p>' +
      '<div class="course-grid" id="course-grid"></div>';

    const grid = document.getElementById('course-grid');

    if (courses.length === 0) {
      grid.insertAdjacentHTML('beforebegin', '<div class="empty-state">No courses have been published yet — check back soon.</div>');
      return;
    }

    courses.forEach(c => {
      const modsForCourse = allModules.filter(m => m.course_id === c.id);
      const total = modsForCourse.length;
      const completed = modsForCourse.filter(m => completedSet.has(m.id)).length;
      const pct = total ? Math.round((completed / total) * 100) : 0;

      const thumb = courseThumbUrls[c.id]
        ? '<img class="course-thumb" src="' + courseThumbUrls[c.id] + '" alt="">'
        : '<div class="course-thumb-placeholder">No thumbnail</div>';

      const card = document.createElement('div');
      card.className = 'course-card';
      card.dataset.id = c.id;
      card.innerHTML =
        thumb +
        '<div class="course-card-body">' +
          '<h3>' + escapeHtml(c.title) + '</h3>' +
          '<p>' + escapeHtml(c.description || '') + '</p>' +
          '<div class="course-progress-shell"><div class="course-progress-bar" style="width:' + pct + '%;"></div></div>' +
          '<div class="course-progress-label">' + completed + ' / ' + total + ' modules complete</div>' +
        '</div>';
      card.addEventListener('click', () => renderCourseDetail(c.id));
      grid.appendChild(card);
    });
  }

  // ============================================================
  // COURSE DETAIL VIEW (modules)
  // ============================================================
  async function renderCourseDetail(courseId) {
    currentCourseId = courseId;
    openModuleId = null;
    const course = courses.find(c => c.id === courseId);
    const modsForCourse = allModules.filter(m => m.course_id === courseId).sort((a,b) => a.position - b.position);

    const { data: fileRows } = await sb.from('course_files').select('*').order('uploaded_at');
    modsForCourse.forEach(m => {
      m.files = (fileRows || []).filter(f => f.module_id === m.id);
    });

    content.innerHTML =
      '<button class="back-link" id="back-to-catalog">&larr; Back to courses</button>' +
      '<div class="course-detail-head">' +
        '<h1>' + escapeHtml(course.title) + '</h1>' +
        '<p class="sub">' + escapeHtml(course.description || '') + '</p>' +
      '</div>' +
      '<div class="progress-label" id="progress-label"></div>' +
      '<div class="progress-shell"><div class="progress-bar" id="progress-bar"></div></div>' +
      '<div id="module-list"></div>';

    document.getElementById('back-to-catalog').addEventListener('click', renderCatalog);

    renderModuleList(modsForCourse);
  }

  function renderModuleList(modsForCourse) {
    const list = document.getElementById('module-list');
    list.innerHTML = '';

    if (modsForCourse.length === 0) {
      list.innerHTML = '<div class="empty-state">No modules have been added to this course yet.</div>';
    }

    modsForCourse.forEach((m, idx) => {
      const isDone = completedSet.has(m.id);
      const isOpen = openModuleId === m.id;

      const row = document.createElement('div');
      row.className = 'module' + (isDone ? ' done' : '');

      let videoHtml = '<div class="no-video">No video uploaded for this module yet.</div>';
      const ytId = getYouTubeId(m.youtube_url);
      if (ytId) {
        videoHtml = '<div class="video-wrap"><iframe src="https://www.youtube.com/embed/' + ytId +
          '" allowfullscreen></iframe></div>';
      }

      let filesHtml = '';
      if (m.files && m.files.length) {
        filesHtml = '<div class="file-links">' + m.files.map(f =>
          '<a class="file-link" href="#" data-path="' + f.file_path + '">' + escapeHtml(f.file_name) + '</a>'
        ).join('') + '</div>';
      }

      row.innerHTML =
        '<div class="module-head" data-toggle="' + m.id + '">' +
          '<span class="num">MOD ' + String(idx + 1).padStart(2,'0') + '</span>' +
          '<div class="module-info"><h3>' + escapeHtml(m.title || 'Untitled Module') + '</h3></div>' +
          '<button class="check-btn' + (isDone ? ' done' : '') + '" data-mod="' + m.id + '">' +
            (isDone ? 'Completed' : 'Mark complete') + '</button>' +
        '</div>' +
        '<div class="module-body' + (isOpen ? ' open' : '') + '" id="body-' + m.id + '">' +
          videoHtml +
          (m.description ? '<p class="module-desc">' + escapeHtml(m.description) + '</p>' : '') +
          filesHtml +
        '</div>';

      list.appendChild(row);
    });

    document.querySelectorAll('.module-head').forEach(head => {
      head.addEventListener('click', (e) => {
        if (e.target.classList.contains('check-btn')) return;
        const id = parseInt(head.dataset.toggle, 10);
        openModuleId = (openModuleId === id) ? null : id;
        renderModuleList(modsForCourse);
      });
    });

    document.querySelectorAll('.check-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleModule(parseInt(btn.dataset.mod, 10), modsForCourse);
      });
    });

    document.querySelectorAll('.file-link').forEach(link => {
      link.addEventListener('click', async (e) => {
        e.preventDefault();
        const path = link.dataset.path;
        const { data, error } = await sb.storage.from('course-files').createSignedUrl(path, 3600);
        if (!error && data) window.open(data.signedUrl, '_blank');
      });
    });

    updateProgressBar(modsForCourse);
  }

  function updateProgressBar(modsForCourse) {
    const total = modsForCourse.length;
    const completed = modsForCourse.filter(m => completedSet.has(m.id)).length;
    const pct = total ? Math.round((completed / total) * 100) : 0;
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-label').textContent = completed + ' / ' + total + ' modules complete';
  }

  async function toggleModule(moduleId, modsForCourse) {
    if (completedSet.has(moduleId)) {
      await sb.from('progress').delete().eq('user_id', currentUser.id).eq('module_id', moduleId);
      completedSet.delete(moduleId);
    } else {
      await sb.from('progress').insert({ user_id: currentUser.id, module_id: moduleId });
      completedSet.add(moduleId);
    }
    renderModuleList(modsForCourse);
  }

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'index.html';
  });

  // Settings / delete account
  const settingsModal = document.getElementById('settings-modal');
  document.getElementById('settings-btn').addEventListener('click', () => settingsModal.classList.add('open'));
  document.getElementById('cancel-settings').addEventListener('click', () => settingsModal.classList.remove('open'));

  document.getElementById('confirm-delete').addEventListener('click', async () => {
    const btn = document.getElementById('confirm-delete');
    const status = document.getElementById('delete-status');
    btn.disabled = true;
    status.textContent = 'Deleting your account...';

    try {
      const res = await fetch(SUPABASE_URL + '/functions/v1/delete-account', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + currentSession.access_token,
          'apikey': SUPABASE_ANON_KEY
        }
      });
      const result = await res.json();
      if (!res.ok) {
        status.textContent = result.error || 'Something went wrong.';
        btn.disabled = false;
        return;
      }
      await sb.auth.signOut();
      window.location.href = 'index.html';
    } catch (err) {
      status.textContent = 'Something went wrong. Please try again.';
      btn.disabled = false;
    }
  });

  init();
</script>

</body>
</html>
