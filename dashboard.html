<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — The Edit Bay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14151A;
    --panel: #1E2027;
    --panel-line: #2B2E38;
    --text: #F2F0EA;
    --text-dim: #9AA0AC;
    --signal-red: #FF4D5E;
    --scope-cyan: #37D6C4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Inter', sans-serif;}
  .mono{font-family:'IBM Plex Mono', monospace;}

  header{
    display:flex; justify-content:space-between; align-items:center;
    padding:20px 5vw; border-bottom:1px solid var(--panel-line);
  }
  .brand{font-family:'Inter Tight', sans-serif; font-weight:800; font-size:1.1rem;}
  .brand .accent{color:var(--signal-red);}
  .who{font-size:13px; color:var(--text-dim); text-align:right;}
  .who strong{color:var(--text);}
  .logout-btn{
    background:none; border:1px solid var(--panel-line); color:var(--text-dim);
    font-family:'IBM Plex Mono', monospace; font-size:12px; padding:8px 14px;
    border-radius:3px; cursor:pointer; margin-left:16px;
  }
  .logout-btn:hover{border-color:var(--signal-red); color:var(--text);}
  .header-right{display:flex; align-items:center;}

  main{padding:6vh 5vw; max-width:900px; margin:0 auto;}
  h1{font-family:'Inter Tight', sans-serif; font-size:2rem; margin-bottom:10px;}
  .sub{color:var(--text-dim); margin-bottom:30px;}

  .progress-shell{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:4px;
    padding:4px; margin-bottom:36px;
  }
  .progress-bar{
    height:8px; background:var(--scope-cyan); border-radius:3px; width:0%;
    transition:width 0.3s ease;
  }
  .progress-label{font-size:12px; color:var(--text-dim); margin-bottom:10px; text-align:right;}

  .module{
    display:flex; align-items:center; gap:18px;
    background:var(--panel); border:1px solid var(--panel-line); border-radius:4px;
    padding:18px 20px; margin-bottom:10px;
  }
  .module.done{border-color:var(--scope-cyan);}
  .module .num{
    font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--scope-cyan);
    width:52px; flex-shrink:0;
  }
  .module-info{flex:1;}
  .module-info h3{font-family:'Inter Tight', sans-serif; font-size:1rem; font-weight:700; margin-bottom:4px;}
  .module-info p{font-size:13px; color:var(--text-dim);}
  .check-btn{
    flex-shrink:0; background:var(--bg); border:1px solid var(--panel-line);
    color:var(--text-dim); font-family:'IBM Plex Mono', monospace; font-size:12px;
    padding:9px 16px; border-radius:3px; cursor:pointer;
  }
  .check-btn.done{background:var(--scope-cyan); color:#14151A; border-color:var(--scope-cyan);}
  .check-btn:hover{border-color:var(--scope-cyan);}

  .loading{color:var(--text-dim); padding:40px 0;}
</style>
</head>
<body>

  <header>
    <span class="brand mono">THE EDIT <span class="accent">BAY</span></span>
    <div class="header-right">
      <span class="who mono" id="who-info">Loading...</span>
      <button class="logout-btn" id="logout-btn">Log Out</button>
    </div>
  </header>

  <main>
    <div id="loading" class="loading mono">Loading your course...</div>

    <div id="content" style="display:none;">
      <h1>Your course</h1>
      <p class="sub">Work through the modules below in order. Mark each one complete as you finish it.</p>

      <div class="progress-label mono" id="progress-label">0 / 10 modules complete</div>
      <div class="progress-shell"><div class="progress-bar" id="progress-bar"></div></div>

      <div id="module-list"></div>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://jayrwrnlndlavmxywazz.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpheXJ3cm5sbmRsYXZteHl3YXp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNDIwODgsImV4cCI6MjEwMDcxODA4OH0.lRSNGUf_sKE2vzy39zT1BYGUnHH-bXWiR1GnxOCgJpQ';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const MODULES = [
    { num: 1, title: 'Introduction & Interface', desc: 'Getting familiar with the editing software layout, panels, and where everything lives.' },
    { num: 2, title: 'Importing Media', desc: 'Bringing in footage and photos from your phone or camera and organizing them before you start cutting.' },
    { num: 3, title: 'Basic Editing', desc: 'Cutting, trimming, and arranging clips into a rough sequence.' },
    { num: 4, title: 'Audio Editing', desc: 'Adjusting levels, cleaning up sound, and syncing audio to video.' },
    { num: 5, title: 'Text & Titles', desc: "Adding captions, lower-thirds, and on-screen text that's easy to read." },
    { num: 6, title: 'Transitions', desc: 'Using cuts and transitions to move smoothly between shots.' },
    { num: 7, title: 'Effects & Filters', desc: 'Applying color adjustments and filters to make footage look consistent.' },
    { num: 8, title: 'Overlays & Animation', desc: 'Adding simple graphics, logos, and animated elements on top of the footage.' },
    { num: 9, title: 'Exporting', desc: 'Choosing the right settings to export a finished video for social media or presentations.' },
    { num: 10, title: 'Final Project', desc: 'Putting it all together in one complete edited video from start to finish.' }
  ];

  let currentUser = null;
  let completedSet = new Set();

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      window.location.href = 'login.html';
      return;
    }
    currentUser = session.user;

    // Load profile (name + station)
    const { data: profile } = await sb.from('profiles')
      .select('full_name, fire_station')
      .eq('id', currentUser.id)
      .single();

    document.getElementById('who-info').innerHTML =
      (profile ? '<strong>' + profile.full_name + '</strong><br>' + profile.fire_station : currentUser.email);

    // Load progress
    const { data: progressRows } = await sb.from('progress')
      .select('module_number')
      .eq('user_id', currentUser.id);

    completedSet = new Set((progressRows || []).map(r => r.module_number));

    renderModules();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  }

  function renderModules() {
    const list = document.getElementById('module-list');
    list.innerHTML = '';
    MODULES.forEach(m => {
      const isDone = completedSet.has(m.num);
      const row = document.createElement('div');
      row.className = 'module' + (isDone ? ' done' : '');
      row.innerHTML =
        '<span class="num mono">MOD ' + String(m.num).padStart(2, '0') + '</span>' +
        '<div class="module-info"><h3>' + m.title + '</h3><p>' + m.desc + '</p></div>' +
        '<button class="check-btn' + (isDone ? ' done' : '') + '" data-mod="' + m.num + '">' +
        (isDone ? 'Completed' : 'Mark complete') + '</button>';
      list.appendChild(row);
    });

    document.querySelectorAll('.check-btn').forEach(btn => {
      btn.addEventListener('click', () => toggleModule(parseInt(btn.dataset.mod, 10)));
    });

    updateProgressBar();
  }

  function updateProgressBar() {
    const pct = Math.round((completedSet.size / MODULES.length) * 100);
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-label').textContent =
      completedSet.size + ' / ' + MODULES.length + ' modules complete';
  }

  async function toggleModule(num) {
    if (completedSet.has(num)) {
      await sb.from('progress').delete().eq('user_id', currentUser.id).eq('module_number', num);
      completedSet.delete(num);
    } else {
      await sb.from('progress').insert({ user_id: currentUser.id, module_number: num });
      completedSet.add(num);
    }
    renderModules();
  }

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'login.html';
  });

  init();
</script>

</body>
</html>
