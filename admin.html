<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — The Edit Bay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14151A; --panel: #1E2027; --panel-line: #2B2E38;
    --text: #F2F0EA; --text-dim: #9AA0AC;
    --signal-red: #FF4D5E; --scope-cyan: #37D6C4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Poppins', sans-serif;}
  header{
    display:flex; justify-content:space-between; align-items:center;
    padding:20px 5vw; border-bottom:1px solid var(--panel-line);
  }
  .brand{font-weight:800; font-size:1.1rem;}
  .brand .accent{color:var(--signal-red);}
  .back-link{color:var(--text-dim); text-decoration:none; font-size:13px; font-weight:600;}
  .back-link:hover{color:var(--text);}
  main{padding:5vh 5vw; max-width:820px; margin:0 auto;}
  h1{font-size:1.8rem; font-weight:800; margin-bottom:8px;}
  .sub{color:var(--text-dim); margin-bottom:32px;}
  .loading{color:var(--text-dim); padding:40px 0;}

  .module-card{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:10px;
    padding:22px 24px; margin-bottom:16px;
  }
  .module-card h3{font-size:1rem; font-weight:700; margin-bottom:16px;}
  .module-card .tag{color:var(--scope-cyan); font-weight:700; font-size:12px; margin-right:8px;}
  label{font-size:12px; color:var(--text-dim); letter-spacing:0.04em; text-transform:uppercase; font-weight:600; display:block; margin-bottom:6px;}
  .field{margin-bottom:14px;}
  input[type=text], textarea{
    background:var(--bg); border:1px solid var(--panel-line); color:var(--text);
    font-family:'Poppins', sans-serif; font-size:14px; padding:11px 13px;
    border-radius:8px; width:100%; resize:vertical;
  }
  input[type=text]:focus, textarea:focus{outline:none; border-color:var(--scope-cyan);}
  input[type=file]{
    font-family:'Poppins', sans-serif; font-size:13px; color:var(--text-dim);
  }
  .file-list{display:flex; flex-direction:column; gap:6px; margin:10px 0;}
  .file-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--bg); border:1px solid var(--panel-line); border-radius:6px;
    padding:8px 12px; font-size:13px;
  }
  .file-row .remove-file{
    background:none; border:none; color:var(--signal-red); cursor:pointer; font-size:12px; font-weight:600;
  }
  .save-btn{
    background:var(--scope-cyan); color:#14151A; border:none; font-weight:700;
    font-size:13px; padding:10px 20px; border-radius:8px; cursor:pointer; margin-top:6px;
  }
  .save-btn:hover{opacity:0.9;}
  .save-btn:disabled{opacity:0.5; cursor:not-allowed;}
  .status{font-size:12px; color:var(--scope-cyan); margin-top:8px; min-height:16px;}
  .status.error{color:var(--signal-red);}
  .denied{padding:10vh 0; text-align:center; color:var(--text-dim);}
</style>
</head>
<body>

  <header>
    <span class="brand">THE EDIT <span class="accent">BAY</span> — Admin</span>
    <a class="back-link" href="dashboard.html">&larr; Back to dashboard</a>
  </header>

  <main>
    <div id="loading" class="loading">Checking access...</div>
    <div id="denied" class="denied" style="display:none;">You don't have admin access to this page.</div>

    <div id="content" style="display:none;">
      <h1>Manage course content</h1>
      <p class="sub">Add an Unlisted YouTube link, a description, and any files for each module. Students see this on their dashboard.</p>
      <div id="module-list"></div>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://jayrwrnlndlavmxywazz.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpheXJ3cm5sbmRsYXZteHl3YXp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNDIwODgsImV4cCI6MjEwMDcxODA4OH0.lRSNGUf_sKE2vzy39zT1BYGUnHH-bXWiR1GnxOCgJpQ';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const MODULE_TITLES = [
    'Introduction & Interface', 'Importing Media', 'Basic Editing', 'Audio Editing',
    'Text & Titles', 'Transitions', 'Effects & Filters', 'Overlays & Animation',
    'Exporting', 'Final Project'
  ];

  let contentByModule = {};
  let filesByModule = {};

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }

    const { data: profile } = await sb.from('profiles')
      .select('is_admin').eq('id', session.user.id).single();

    if (!profile || !profile.is_admin) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('denied').style.display = 'block';
      return;
    }

    const { data: contentRows } = await sb.from('course_content').select('*').order('module_number');
    const { data: fileRows } = await sb.from('course_files').select('*').order('uploaded_at');

    (contentRows || []).forEach(r => contentByModule[r.module_number] = r);
    filesByModule = {};
    (fileRows || []).forEach(f => {
      if (!filesByModule[f.module_number]) filesByModule[f.module_number] = [];
      filesByModule[f.module_number].push(f);
    });

    renderModules();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  }

  function renderModules() {
    const list = document.getElementById('module-list');
    list.innerHTML = '';
    for (let i = 1; i <= 10; i++) {
      const c = contentByModule[i] || { youtube_url: '', description: '' };
      const files = filesByModule[i] || [];

      const card = document.createElement('div');
      card.className = 'module-card';
      card.innerHTML =
        '<h3><span class="tag">MOD ' + String(i).padStart(2,'0') + '</span>' + MODULE_TITLES[i-1] + '</h3>' +
        '<div class="field"><label>YouTube URL (Unlisted)</label>' +
        '<input type="text" id="yt-' + i + '" value="' + (c.youtube_url || '').replace(/"/g,'&quot;') + '" placeholder="https://youtu.be/..."></div>' +
        '<div class="field"><label>Description</label>' +
        '<textarea id="desc-' + i + '" rows="3" placeholder="What this module covers...">' + (c.description || '') + '</textarea></div>' +
        '<div class="field"><label>Files</label><div class="file-list" id="files-' + i + '"></div>' +
        '<input type="file" id="upload-' + i + '" multiple></div>' +
        '<button class="save-btn" data-mod="' + i + '">Save Module ' + i + '</button>' +
        '<div class="status" id="status-' + i + '"></div>';
      list.appendChild(card);

      const fileList = card.querySelector('#files-' + i);
      files.forEach(f => {
        const row = document.createElement('div');
        row.className = 'file-row';
        row.innerHTML = '<span>' + f.file_name + '</span>' +
          '<button class="remove-file" data-file-id="' + f.id + '" data-file-path="' + f.file_path + '">Remove</button>';
        fileList.appendChild(row);
      });
    }

    document.querySelectorAll('.save-btn').forEach(btn => {
      btn.addEventListener('click', () => saveModule(parseInt(btn.dataset.mod, 10)));
    });
    document.querySelectorAll('.remove-file').forEach(btn => {
      btn.addEventListener('click', () => removeFile(btn.dataset.fileId, btn.dataset.filePath));
    });
  }

  async function saveModule(num) {
    const btn = document.querySelector('.save-btn[data-mod="' + num + '"]');
    const status = document.getElementById('status-' + num);
    btn.disabled = true;
    status.className = 'status';
    status.textContent = 'Saving...';

    const youtubeUrl = document.getElementById('yt-' + num).value.trim();
    const description = document.getElementById('desc-' + num).value.trim();

    const { error: upsertError } = await sb.from('course_content').upsert({
      module_number: num,
      youtube_url: youtubeUrl,
      description: description,
      updated_at: new Date().toISOString()
    });

    if (upsertError) {
      status.className = 'status error';
      status.textContent = upsertError.message;
      btn.disabled = false;
      return;
    }

    const fileInput = document.getElementById('upload-' + num);
    const newFiles = Array.from(fileInput.files || []);
    for (const file of newFiles) {
      const path = 'module-' + num + '/' + Date.now() + '-' + file.name;
      const { error: uploadError } = await sb.storage.from('course-files').upload(path, file);
      if (uploadError) {
        status.className = 'status error';
        status.textContent = 'File upload failed: ' + uploadError.message;
        btn.disabled = false;
        return;
      }
      await sb.from('course_files').insert({
        module_number: num, file_name: file.name, file_path: path
      });
    }

    status.textContent = 'Saved.';
    btn.disabled = false;

    const { data: fileRows } = await sb.from('course_files').select('*').eq('module_number', num).order('uploaded_at');
    filesByModule[num] = fileRows || [];
    renderModules();
  }

  async function removeFile(fileId, filePath) {
    await sb.storage.from('course-files').remove([filePath]);
    await sb.from('course_files').delete().eq('id', fileId);
    for (const m in filesByModule) {
      filesByModule[m] = filesByModule[m].filter(f => String(f.id) !== String(fileId));
    }
    renderModules();
  }

  init();
</script>

</body>
</html>
